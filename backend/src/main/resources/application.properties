# --- Serveur ---
server.port=${PORT:8080}

# --- Base de données MySQL (Aiven) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.password=disabled
logging.level.org.springframework.security=DEBUG

# --- JWT ---
jwt.secret=fastprint_secret_key_2026_very_long_and_secure_key_for_jwt_token
jwt.expiration=86400000

# --- Upload de fichiers (taille max acceptée par Spring, avant envoi vers Cloudinary) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- Cloudinary (stockage persistant des images et documents) ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}