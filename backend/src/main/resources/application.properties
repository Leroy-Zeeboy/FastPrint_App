# --- Serveur ---
server.port=8080

# --- Base de données MySQL (XAMPP) ---
spring.datasource.url=jdbc:mysql://localhost:3306/FastPrint?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.password=disabled
logging.level.org.springframework.security=DEBUG

# JWT
jwt.secret=fastprint_secret_key_2026_very_long_and_secure_key_for_jwt_token
jwt.expiration=86400000

# Upload de fichiers
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB